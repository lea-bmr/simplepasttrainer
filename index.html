<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple Past · Übungswelt</title><style>
:root{--ink:#22324a;--purple:#7056bd;--pale:#f7f5ff;--mint:#dff5ed;--pink:#ffedf0;--yellow:#fff2c9;--line:#e3e5ee}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff8e9,#f2f9ff 55%,#f9f2ff);color:var(--ink);font:18px/1.45 'Comic Sans MS','Trebuchet MS',system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer}header{max-width:1120px;margin:auto;padding:28px 20px 14px;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{margin:0;color:#58429d;font-size:clamp(29px,4vw,44px)}header p{margin:3px 0}.score{background:white;border:2px solid #ded7f5;border-radius:24px;padding:10px 17px;box-shadow:0 5px 18px #6b5a9915}main{max-width:1120px;margin:auto;padding:8px 20px 60px}.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.level{border:2px solid #e7e1f9;border-radius:21px;background:#fff;padding:16px;text-align:left;min-height:110px;box-shadow:0 5px 18px #8272ae12;color:var(--ink)}.level:hover,.level.active{border-color:var(--purple);background:var(--pale)}.level strong{display:block;color:var(--purple);font-size:21px}.level small{font-size:15px}.panel{margin-top:20px;background:#fff;border:2px solid #e9e4f2;border-radius:26px;padding:clamp(18px,3vw,32px);box-shadow:0 10px 35px #77699b16}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.tag{background:#ebe5ff;border-radius:20px;padding:5px 13px;color:#543b9b;font-weight:bold}h2{font-size:27px;margin:12px 0 3px;color:#58429d}.hint{margin:0 0 20px;color:#536078}.progress{height:12px;background:#eeeaf7;border-radius:20px;overflow:hidden;margin:18px 0}.bar{height:100%;background:#8cdbbd;transition:width .3s}.task{background:#faf9ff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:15px 0}.task h3{margin:0 0 10px;font-size:18px}.prompt{font-size:21px;margin:8px 0}.answer{width:min(100%,550px);border:2px solid #c9c1e9;border-radius:12px;background:white;padding:10px 13px;margin:8px 0}.answer:focus{outline:3px solid #cfc0ff}.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:9px}.btn{border:0;border-radius:13px;padding:10px 16px;background:#7357bd;color:white;font-weight:bold}.btn:hover{filter:brightness(1.08)}.btn.alt{background:#eae5fa;color:#513d8e}.btn.reset{background:#fff0ec;color:#9b493c}.btn:disabled{opacity:.5;cursor:default}.feedback{margin-top:10px;border-radius:12px;padding:10px 12px;background:#eef8f3}.feedback.bad{background:var(--pink)}.feedback:empty{display:none}.chips,.drop{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;align-items:center}.drop{border:2px dashed #b8abe2;border-radius:13px;padding:8px;background:white}.chip{border:1px solid #b6a8dd;background:#f0eafb;color:#473575;border-radius:11px;padding:8px 13px}.chip.selected{background:#cbbcf2}.pick{border:2px solid #d9d0f5;background:white;border-radius:12px;padding:10px 15px;color:var(--ink)}.pick:hover{border-color:var(--purple)}.verbpair{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.verbpair>span:not(.arrow){display:flex;flex-direction:column;justify-content:center;min-width:145px;flex:1;background:white;border:1px solid #ded7f5;border-radius:14px;padding:10px 14px}.verbpair small{color:#66718a}.verbpair strong{font-size:24px}.verbpair .answer{width:100%;margin:3px 0}.arrow{font-size:28px;color:#7056bd}.finished{background:var(--mint);border-radius:18px;padding:17px;margin-top:16px}.muted{color:#66718a;font-size:15px}label{display:block;font-weight:bold}footer{text-align:center;color:#607087;font-size:14px;padding:10px} @media(max-width:600px){body{font-size:16px}.prompt{font-size:18px}.level{min-height:90px}header{padding-top:18px}} </style></head><body><header><div><h1>🌟 Simple Past</h1><p>Übe in deinem Tempo – jedes Level hat 10 neue Aufgaben.</p></div><div class="score">⭐ Punkte: <strong id="score">0</strong> <button class="btn reset" id="reset">Reset</button></div></header><main><nav class="levels" id="levels" aria-label="Level auswählen"></nav><section class="panel" id="panel"><h2>Wähle ein Level aus!</h2><p>Bei jeder Auswahl werden zehn Beispiele neu gemischt.</p></section></main><footer>Deine Antworten bleiben auf diesem Gerät und werden nicht verschickt.</footer><script>
'use strict';
const POS=[['play','played','football in the park'],['visit','visited','my grandma on Sunday'],['watch','watched','a funny film'],['clean','cleaned','her room'],['listen','listened','to music'],['cook','cooked','dinner'],['help','helped','his friend'],['dance','danced','at the party'],['walk','walked','to school'],['paint','painted','a picture'],['go','went','to the zoo'],['see','saw','a dog'],['eat','ate','an apple'],['drink','drank','some water'],['buy','bought','a new book'],['have','had','breakfast'],['make','made','a cake'],['take','took','the bus'],['write','wrote','a letter'],['find','found','a key'],['come','came','home late'],['do','did','the homework'],['get','got','a present'],['run','ran','very fast']];
const NEG=[['play','football yesterday'],['visit','my uncle last week'],['watch','TV last night'],['clean','the kitchen'],['listen','to the teacher'],['cook','lunch yesterday'],['help','her brother'],['dance','at the party'],['go','to the cinema'],['see','the new film'],['eat','the pizza'],['drink','the juice'],['buy','a new bike'],['have','time yesterday'],['make','a sandwich'],['take','the bus'],['write','an email'],['find','her bag'],['come','to school on Monday'],['do','the homework']];
const PEOPLE=['I','She','He','We','They','Tom','Emma','My friends','The children','You'];
const ORDER=[['Did','you','play','football','yesterday?'],['Did','she','visit','her grandma','last weekend?'],['Did','Tom','watch','the film','last night?'],['Did','they','go','to the park','on Sunday?'],['Did','he','eat','breakfast','this morning?'],['Did','Emma','buy','a book','yesterday?'],['Did','you','see','the dog','at school?'],['Did','we','have','English','on Monday?'],['Did','your friends','make','a cake','yesterday?'],['Did','the children','run','to the playground?'],['Where','did','you','go','yesterday?'],['What','did','she','eat','for lunch?'],['When','did','they','visit','London?'],['Why','did','he','call','you?'],['How','did','Emma','get','home?'],['What','did','you','do','last weekend?'],['Who','did','Tom','meet','on Monday?'],['Where','did','the family','stay','last summer?']];
// Level 4: Antwort + erwartete Frage im Simple Past. Die deutschen Hinweise legen eine klare Frage fest.
const ASK=[
['I went to the zoo yesterday.','Frage: Wohin gingst du gestern?','Where did you go yesterday?'],['She ate pizza for lunch.','Frage: Was aß sie zu Mittag?','What did she eat for lunch?'],['Tom visited his grandma on Sunday.','Frage: Wen besuchte Tom am Sonntag?','Who did Tom visit on Sunday?'],['They played football after school.','Frage: Was spielten sie nach der Schule?','What did they play after school?'],['Emma bought a book yesterday.','Frage: Was kaufte Emma gestern?','What did Emma buy yesterday?'],['We watched a film last night.','Frage: Was habt ihr gestern Abend angeschaut?','What did you watch last night?'],['He went to London by train.','Frage: Wie fuhr er nach London?','How did he go to London?'],['I got home at six o’clock.','Frage: Wann kamst du nach Hause?','When did you get home?'],['They stayed in a hotel.','Frage: Wo übernachteten sie?','Where did they stay?'],['Mia wrote a letter to her friend.','Frage: Was schrieb Mia ihrer Freundin?','What did Mia write to her friend?'],['Ben drank orange juice.','Frage: Was trank Ben?','What did Ben drink?'],['She made a cake for her mum.','Frage: Was machte sie für ihre Mutter?','What did she make for her mum?'],['I saw a fox in the garden.','Frage: Was hast du im Garten gesehen?','What did you see in the garden?'],['We left at eight o’clock.','Frage: Wann seid ihr losgegangen?','When did you leave?'],['He met his friend at the station.','Frage: Wo traf er seinen Freund?','Where did he meet his friend?'],['They went to the beach on Saturday.','Frage: Wann gingen sie an den Strand?','When did they go to the beach?'],['Lisa found her keys under the table.','Frage: Wo fand Lisa ihre Schlüssel?','Where did Lisa find her keys?'],['I did my homework after dinner.','Frage: Wann hast du deine Hausaufgaben gemacht?','When did you do your homework?']];
const BE=[
['I ___ at home yesterday.','was'],['She ___ tired after school.','was'],['They ___ in the park on Sunday.','were'],['We ___ very happy.','were'],['Tom ___ late for class.','was'],['You ___ at the party.','were'],['The children ___ hungry.','were'],['My dog ___ in the garden.','was'],['I ___ not at school yesterday.','was'],['He ___ not ill last week.','was'],['We ___ not ready.','were'],['They ___ not at home.','were'],['Emma ___ not angry.','was'],['You ___ not alone.','were'],['___ she at the cinema?','Was'],['___ they in London?','Were'],['___ you happy yesterday?','Were'],['___ it cold last night?','Was'],['___ we too late?','Were'],['___ Ben at school on Monday?','Was'],['Where ___ you yesterday?','were'],['Why ___ he sad?','was'],['Who ___ at the door?','was'],['Where ___ the books?','were']];
const IRREG=[['be','was/were'],['begin','began'],['break','broke'],['bring','brought'],['buy','bought'],['catch','caught'],['come','came'],['do','did'],['drink','drank'],['drive','drove'],['eat','ate'],['fall','fell'],['find','found'],['fly','flew'],['get','got'],['give','gave'],['go','went'],['have','had'],['hear','heard'],['know','knew'],['leave','left'],['make','made'],['meet','met'],['read','read'],['ride','rode'],['run','ran'],['say','said'],['see','saw'],['sing','sang'],['sit','sat'],['sleep','slept'],['speak','spoke'],['swim','swam'],['take','took'],['teach','taught'],['tell','told'],['think','thought'],['write','wrote']];
const META=[['Positive Sätze','Schreibe die Vergangenheitsform in die Lücke.'],['Verneinte Sätze','Schreibe die ganze Verneinung: did not / didn’t / didnt + Grundform.'],['Fragen ordnen','Tippe die Wörter in der richtigen Reihenfolge an.'],['Fragen stellen','Schreibe eine passende Frage im Simple Past zur Antwort.'],['Was & were','Aussagesätze, Verneinungen und Fragen mit was/were.'],['Irregular verbs','Ergänze die Grundform oder die Simple-Past-Form.']];
const $=id=>document.getElementById(id), shuffle=a=>[...a].sort(()=>Math.random()-.5), choose=(a,n)=>shuffle(a).slice(0,n);
let score=0, current=-1, items=[], results=[], selected=[], attempts=[];
const norm=s=>s.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[?.!,]/g,'').replace(/\s+/g,' ').trim();
const wordnorm=s=>norm(s).replace(/\bdidnt\b|\bdidn\s*t\b|\bdid\s+not\b/g,"didn't");
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function update(){ $('score').textContent=score; $('levels').innerHTML=META.map(([title,desc],i)=>`<button class="level ${i===current?'active':''}" data-level="${i}"><strong>${i+1}. ${title}</strong><small>${desc}</small></button>`).join('');}
function start(i){current=i;items= i===0?choose(POS,10).map((p,j)=>({base:p[0],answer:p[1],text:`${PEOPLE[j]} ___ ${p[2]}.`})) : i===1?choose(NEG,10).map((p,j)=>({base:p[0],answer:`didn't ${p[0]}`,text:`${PEOPLE[j]} ___ (not ${p[0]}) ${p[1]}.`})) : i===2?choose(ORDER,10).map(p=>({tokens:p,answer:p.join(' ')})) : i===3?choose(ASK,10).map(p=>({text:p[0],hint:p[1],answer:p[2]})) : i===4?shuffle([...choose(BE.slice(0,8),3),...choose(BE.slice(8,14),3),...choose(BE.slice(14),4)]).map(p=>({text:p[0],answer:p[1]})) :choose(IRREG.filter(p=>p[0]!=='be'),10).map((p,j)=>({base:p[0],past:p[1],reverse:j>=5,answer:j>=5?p[0]:p[1]}));results=Array(10).fill(null);attempts=Array(10).fill(0);selected=Array.from({length:10},()=>[]);update();render();}
function render(){let [title,hint]=META[current];$('panel').innerHTML=`<div class="top"><span class="tag">Level ${current+1} · 10 Aufgaben</span><button class="btn alt" id="fresh">↻ Neue Beispiele</button></div><h2>${title}</h2><p class="hint">${hint}</p><div class="progress"><div class="bar" id="bar"></div></div><div id="tasks"></div><div id="finish"></div>`;$('fresh').onclick=()=>start(current);$('tasks').innerHTML=items.map((it,i)=>card(it,i)).join('');items.forEach((it,i)=>{if(current===2) drawChips(i); else $('check'+i).onclick=()=>check(i);});progress();}
function card(it,i){let prompt=current===5?'Ergänze das fehlende Verb.':current===2?'Baue die Frage. Tippe dazu die Wörter an.':current===3?`<strong>Antwort:</strong> ${safe(it.text)}<br><span class="muted">${safe(it.hint)}</span>`:safe(it.text);let body=current===5?`<div class="verbpair"><span><small>Grundform</small>${it.reverse?`<input class="answer" id="input${i}" aria-label="Grundform" autocomplete="off" spellcheck="false" placeholder="Grundform">`:`<strong>${safe(it.base)}</strong>`}</span><span class="arrow">→</span><span><small>Simple Past</small>${it.reverse?`<strong>${safe(it.past)}</strong>`:`<input class="answer" id="input${i}" aria-label="Simple-Past-Form" autocomplete="off" spellcheck="false" placeholder="Simple Past">`}</span></div><div class="actions"><button class="btn" id="check${i}">Überprüfen</button></div>`:current===2?`<div class="drop" id="drop${i}" aria-label="Deine Frage"></div><p class="muted">Wörter:</p><div class="chips" id="chips${i}"></div><div class="actions"><button class="btn alt" id="undo${i}">↶ Letztes Wort zurück</button><button class="btn alt" id="clear${i}">Leeren</button><button class="btn" id="check${i}">Überprüfen</button></div>`:`<label for="input${i}">Deine Antwort</label><input class="answer" id="input${i}" autocomplete="off" spellcheck="false" ${current===0?`placeholder="${safe(it.base)} → ?"`:current===1?'placeholder="z. B. didn’t play"':current===4?'placeholder="was oder were"':'placeholder="Deine Frage im Simple Past"'}><div class="actions"><button class="btn" id="check${i}">Überprüfen</button></div>`;return `<article class="task" id="task${i}"><h3>Aufgabe ${i+1}</h3><p class="prompt">${prompt}</p>${body}<div class="feedback" id="feedback${i}" aria-live="polite"></div></article>`;}
function drawChips(i){let it=items[i];if(!it.shuffled)it.shuffled=shuffle(it.tokens.map((t,j)=>({t,j})));let used=new Set(selected[i]);$('chips'+i).innerHTML=it.shuffled.filter(x=>!used.has(x.j)).map(x=>`<button class="chip" data-id="${x.j}">${safe(x.t)}</button>`).join('');$('drop'+i).innerHTML=selected[i].map(j=>`<button class="chip selected" data-id="${j}">${safe(it.tokens[j])}</button>`).join('');$('chips'+i).querySelectorAll('button').forEach(b=>b.onclick=()=>{selected[i].push(+b.dataset.id);drawChips(i)});$('drop'+i).querySelectorAll('button').forEach(b=>b.onclick=()=>{selected[i].splice(selected[i].indexOf(+b.dataset.id),1);drawChips(i)});$('undo'+i).onclick=()=>{selected[i].pop();drawChips(i)};$('clear'+i).onclick=()=>{selected[i]=[];drawChips(i)};$('check'+i).onclick=()=>check(i);}
function check(i){if(results[i]!==null)return;let it=items[i],raw=current===2?selected[i].map(j=>it.tokens[j]).join(' '):$('input'+i).value.trim();let f=$('feedback'+i);if(!raw){f.className='feedback bad';f.textContent='Schreibe zuerst eine Antwort.';return}attempts[i]++;let correct= current===1?wordnorm(raw)===wordnorm(it.answer):current===3?norm(raw)===norm(it.answer):norm(raw)===norm(it.answer);if(correct){results[i]=true;score++;f.className='feedback';f.textContent='✓ Richtig! Du bekommst einen Punkt.';lock(i);update();progress();return}if(attempts[i]<2){f.className='feedback bad';f.textContent=current===1?'Noch nicht ganz. Nach did not / didn’t steht die Grundform. Versuch es noch einmal!':current===2?'Die Reihenfolge stimmt noch nicht. Versuche es noch einmal!':current===3?'Achte auf Fragewort + did + Person + Grundform. Versuch es noch einmal!':current===4?'Überlege: I/he/she/it → was, you/we/they → were. Versuch es noch einmal!':'Noch nicht ganz. Prüfe die Vergangenheitsform und versuche es noch einmal!';return}results[i]=false;f.className='feedback bad';f.innerHTML=`✗ Die Lösung lautet: <strong>${safe(it.answer)}</strong>.`;lock(i);progress();}
function lock(i){$('check'+i).disabled=true;if(current===2){$('chips'+i).querySelectorAll('button').forEach(b=>b.disabled=true);$('drop'+i).querySelectorAll('button').forEach(b=>b.disabled=true);$('undo'+i).disabled=true;$('clear'+i).disabled=true}else $('input'+i).disabled=true;}
function progress(){let done=results.filter(x=>x!==null).length,yes=results.filter(Boolean).length;$('bar').style.width=(done*10)+'%';$('finish').innerHTML=done===10?`<div class="finished"><strong>🎉 Level geschafft!</strong><br>${yes} richtig · ${10-yes} falsch · ${yes} Punkte gesammelt.<div class="actions"><button class="btn" id="again">Dieses Level neu spielen</button></div></div>`:'';if(done===10)$('again').onclick=()=>start(current);}
$('levels').addEventListener('click',e=>{let b=e.target.closest('[data-level]');if(b)start(+b.dataset.level)});$('reset').onclick=()=>{score=0;update()};update();
</script></body></html>
